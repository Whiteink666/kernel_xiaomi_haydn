name: Build K40Pro haydn Kernel with SukiSU Ultra

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: '5.4SukiSU-Ultra By白墨(Whiteink)工作室-🐾白墨🐾Whiteink🐾'
        required: true
        default: 'K40Pro-SukiSU-Ultra'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set env
        run: echo "KERNEL_NAME=${{ github.event.inputs.kernel_name }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git make bc bison flex libssl-dev libncurses-dev \
            gcc-aarch64-linux-gnu zip unzip dwarves

      - name: Integrate SukiSU Ultra
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      - name: Build kernel
        run: |
          make ARCH=arm64 clean mrproper
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- haydn_defconfig
          
          ./scripts/config --set-str CONFIG_LOCALVERSION "-${{ env.KERNEL_NAME }}"
          ./scripts/config -e CONFIG_KPM
          ./scripts/config -e CONFIG_KALLSYMS_ALL
          ./scripts/config -e CONFIG_MODULES

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          sed -i 's/^device.name1=.*/device.name1=haydn/' anykernel.sh
          zip -r9 "${{ env.KERNEL_NAME }}-haydn.zip" * -x .git README.md

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-haydn
          path: AnyKernel3/*.zip
