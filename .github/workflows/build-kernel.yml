name: Build K40Pro haydn 5.4 SukiSU Ultra

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "内核名称"
        required: true
        default: "Haydn-SukiSU"
      version:
        description: "版本号"
        required: true
        default: "v1.0"
      author:
        description: "作者名"
        required: true
        default: "MyName"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf flex bison bc libssl-dev zip wget

      - name: Download Clang 18 (Google official)
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r458507.tar.gz
          mkdir -p $HOME/clang-18
          tar -xzf clang-r458507.tar.gz -C $HOME/clang-18

      - name: Load defconfig
        run: |
          make ARCH=arm64 vendor_haydn_defconfig

      - name: Integrate SukiSU Ultra
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki
          scripts/config --file .config \
            -e CONFIG_KPROBES \
            -e CONFIG_KPROBE_EVENT \
            -e CONFIG_KSU_TRACEPOINT_HOOK \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL
          make ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PATH=$HOME/clang-18/bin:$PATH
          make -j$(nproc) Image.gz-dtb \
            KBUILD_BUILD_USER="${{ github.event.inputs.author }}" \
            KBUILD_BUILD_HOST="GitHub-Actions"

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp arch/arm64/boot/Image.gz-dtb ak3/
          cd ak3
          sed -i "s/kernel.string=.*/kernel.string=${{ github.event.inputs.kernel_name }} ${{ github.event.inputs.version }} by ${{ github.event.inputs.author }}/" anykernel.sh
          sed -i "s/device.name1=.*/device.name1=haydn/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=Redmi K40 Pro/" anykernel.sh
          zip -r9 ../${{ github.event.inputs.kernel_name }}-${{ github.event.inputs.version }}.zip * -x .git* README.md

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-flashable-zip
          path: "*.zip"
