name: Build K40Pro haydn Kernel with SukiSU Ultra

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: '自定义内核名字'
        required: true
        default: '5.4_SukiSUUltra_By白墨_Whiteink_工作室'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev libncurses-dev gcc-aarch64-linux-gnu zip unzip dwarves

      - name: Integrate SukiSU Ultra
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      - name: Build kernel
        run: |
          make ARCH=arm64 clean mrproper
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/haydn-qgki_defconfig

          # 全局关闭 警告=错误，这是你所有报错的根源
          ./scripts/config -d CONFIG_WERROR

          # 关闭栈帧警告
          ./scripts/config -d CONFIG_WERROR_FRAME_WARN
          ./scripts/config --set-val CONFIG_FRAME_WARN 16384

          # 必须打开的SU配置
          ./scripts/config -e CONFIG_KPM
          ./scripts/config -e CONFIG_KALLSYMS_ALL
          ./scripts/config -e CONFIG_MODULES

          # 重点：全局忽略所有格式警告、栈帧、类型不匹配
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_CFLAGS="-Wno-format -Wno-frame-larger-than -Wno-all" \
            -j$(nproc)

      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          sed -i 's/^device.name1=.*/device.name1=haydn/' anykernel.sh
          zip -r9 "Kernel-K40Pro-haydn-SukiSU-Ultra.zip" * -x .git README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-haydn
          path: AnyKernel3/*.zip
